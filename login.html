<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Connect - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Bungee', cursive;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .phone-frame {
            position: relative;
            width: 375px;
            height: 812px;
            background: #FFFDF6;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            max-width: 95vw;
            max-height: 95vh;
        }

        .inner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: #FAF6E9;
            border-radius: 20px;
            border: 1px solid #000000;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .page-title {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            text-align: center;
            color: #000;
            margin-bottom: 60px;
            margin-top: 30px;
        }

        .form-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 20px;
        }

        .input-field {
            width: 100%;
            height: 50px;
            background: #DDEB9D;
            border: none;
            border-radius: 25px;
            padding: 0 20px;
            font-family: 'Bungee', cursive;
            font-size: 14px;
            color: #666;
            outline: none;
        }

        .input-field::placeholder {
            color: #666;
            font-family: 'Bungee', cursive;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .social-icon:hover {
            transform: scale(1.1);
        }

        .google-icon {
            background: #fff;
            border: 2px solid #ddd;
        }

        .instagram-icon {
            background: #fff;
            border: 2px solid #ddd;
        }

        .facebook-icon {
            background: #000;
        }

        .login-button {
            width: 100%;
            height: 50px;
            background: #A0C878;
            border: none;
            border-radius: 25px;
            font-family: 'Bungee', cursive;
            font-size: 16px;
            color: #B95A5A;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .login-button:hover {
            background: #8FB86B;
        }

        .signup-text {
            text-align: center;
            margin-top: 20px;
            font-family: 'Bungee', cursive;
        }

        .signup-text .no-account {
            color: #000;
            font-size: 12px;
            display: block;
            margin-bottom: 5px;
        }

        .signup-text .signup-link {
            color: #007BFF;
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .signup-text .signup-link:hover {
            text-decoration: underline;
        }

        /* Responsive adjustments */
        @media (max-width: 400px) {
            .phone-frame {
                width: 95vw;
                height: 95vh;
                border-radius: 20px;
                padding: 15px;
            }

            .page-title {
                font-size: 20px;
                margin-bottom: 40px;
            }

            .input-field {
                font-size: 12px;
            }
        }

        @media (max-height: 700px) {
            .phone-frame {
                height: 95vh;
            }

            .page-title {
                font-size: 20px;
                margin-bottom: 30px;
                margin-top: 20px;
            }

            .social-icons {
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="inner-frame">
            <div class="page-title">LOGIN</div>
            <div class="form-container">
                <input type="email" class="input-field" placeholder="EMAIL" required>
                <input type="password" class="input-field" placeholder="PASSWORD" required>

                <div class="social-icons">
                    <div class="social-icon google-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24">
                            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                        </svg>
                    </div>
                    <div class="social-icon instagram-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#000">
                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                        </svg>
                    </div>
                    <div class="social-icon facebook-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#fff">
                            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </div>
                </div>

                <a href="index.html" style="text-decoration: none; display: block; width: 100%;">
                   <button type="button" class="login-button">LOGIN</button>
                </a>

                <div class="signup-text">
                    <span class="no-account">Don't have an account?</span>
                    <a href="sign-up.html" class="signup-link">Sign up here</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
