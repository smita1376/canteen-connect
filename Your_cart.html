<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen Connect - Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Bungee', cursive;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .phone-frame {
            position: relative;
            width: 375px;
            height: 812px;
            background: #FFFDF6;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 0 50px rgba(0,0,0,0.3);
            max-width: 95vw;
            max-height: 95vh;
            overflow: hidden;
        }
        .inner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            background: #FAF6E9;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #000;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #FAF6E9;
            border-bottom: 2px solid #E5E5E5;
            position: relative;
        }
        .back-btn {
            position: absolute;
            left: 15px;
            width: 35px;
            height: 35px;
            background: none;
            border: 2px solid #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #000;
            color: #fff;
        }
        .cart-title {
            font-family: 'Bungee', cursive;
            font-size: 24px;
            color: #000;
            text-align: center;
        }
        .cart-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            height: calc(100% - 200px);
        }
        .cart-item {
            background: #DDEB9D;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }
        .remove-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            background: #FF6B6B;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            margin-left: 25px;
        }
        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .item-name {
            font-family: 'Bungee', cursive;
            font-size: 18px;
            color: #000;
            margin-bottom: 5px;
        }
        .item-price {
            font-family: 'Bungee', cursive;
            font-size: 14px;
            color: #666;
        }
        .quantity-controls {
            background: #FF8A95;
            border-radius: 20px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 8px;
        }
        .quantity-btn {
            background: none;
            border: none;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bungee', cursive;
        }
        .quantity-btn:hover {
            transform: scale(1.1);
        }
        .quantity {
            font-family: 'Bungee', cursive;
            font-size: 16px;
            color: #000;
            min-width: 20px;
            text-align: center;
        }
        .cart-footer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .total-container {
            background: #FF8A95;
            border-radius: 25px;
            padding: 15px 25px;
            text-align: center;
        }
        .total-text {
            font-family: 'Bungee', cursive;
            font-size: 18px;
            color: #000;
        }
        .place-order-btn {
            background: #A0C878;
            border: none;
            border-radius: 25px;
            padding: 15px 25px;
            font-family: 'Bungee', cursive;
            font-size: 16px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .place-order-btn:hover {
            background: #8FB86B;
            transform: scale(1.02);
        }
        .place-order-btn:active {
            transform: scale(0.98);
        }
        .empty-cart {
            text-align: center;
            padding: 50px 20px;
            color: #666;
            font-family: 'Bungee', cursive;
        }
        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Bungee', cursive;
            font-size: 12px;
            transform: translateX(300px);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .notification.show {
            transform: translateX(0);
        }
        @media (max-width: 400px) {
            .phone-frame {
                width: 95vw;
                height: 95vh;
                border-radius: 20px;
                padding: 15px;
            }
            .cart-title {
                font-size: 20px;
            }
            .item-name {
                font-size: 16px;
            }
            .item-image {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="inner-frame">
            <div class="header">
                <button class="back-btn" onclick="goBack()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                </button>
                <div class="cart-title">YOUR CART</div>
            </div>
            <div class="cart-container" id="cartContainer">
                <!-- Cart items will be loaded here dynamically -->
            </div>
            <div class="cart-footer">
                <div class="total-container">
                    <div class="total-text" id="totalAmount">TOTAL: ₹ 0</div>
                </div>
                <button class="place-order-btn" onclick="placeOrder()">PLACE ORDER</button>
            </div>
        </div>
    </div>
    <div class="notification" id="notification"></div>
    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        function loadCartItems() {
            const cartContainer = document.getElementById('cartContainer');
            cartContainer.innerHTML = '';

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-cart-icon">🛒</div>
                        <div>Your cart is empty!</div>
                    </div>
                `;
                document.querySelector('.cart-footer').style.display = 'none';
                return;
            }

            document.querySelector('.cart-footer').style.display = 'flex';

            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.setAttribute('data-item', item.name);
                cartItem.innerHTML = `
                    <button class="remove-btn" onclick="removeItem('${item.name}')">-</button>
                    <img src="${item.image || 'placeholder.img'}" alt="${item.name}" class="item-image">
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">price: ₹ ${item.price}</div>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="decreaseQuantity('${item.name}')">-</button>
                            <span class="quantity" id="${item.name}-qty">${item.quantity}</span>
                            <button class="quantity-btn" onclick="increaseQuantity('${item.name}')">+</button>
                        </div>
                    </div>
                `;
                cartContainer.appendChild(cartItem);
            });

            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            cart.forEach(item => {
                total += item.price * item.quantity;
            });
            document.getElementById('totalAmount').textContent = `TOTAL: ₹ ${total}`;
        }

        function increaseQuantity(itemName) {
            const item = cart.find(item => item.name === itemName);
            if (item) {
                item.quantity++;
                document.getElementById(`${itemName}-qty`).textContent = item.quantity;
                localStorage.setItem('cart', JSON.stringify(cart));
                updateTotal();
                showNotification(`${itemName} quantity increased!`);
            }
        }

        function decreaseQuantity(itemName) {
            const item = cart.find(item => item.name === itemName);
            if (item && item.quantity > 1) {
                item.quantity--;
                document.getElementById(`${itemName}-qty`).textContent = item.quantity;
                localStorage.setItem('cart', JSON.stringify(cart));
                updateTotal();
                showNotification(`${itemName} quantity decreased!`);
            }
        }

        function removeItem(itemName) {
            const itemElement = document.querySelector(`[data-item="${itemName}"]`);
            itemElement.style.animation = 'slideOut 0.3s ease-out forwards';
            cart = cart.filter(item => item.name !== itemName);
            localStorage.setItem('cart', JSON.stringify(cart));
            setTimeout(() => {
                loadCartItems();
            }, 300);
            showNotification('Item removed from cart!');
        }

        function placeOrder() {
           window.location.href = "payment.html";
        }

        function goBack() {
            window.location.href = "menu.html";
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            setTimeout(() => {
                notification.classList.remove('show');
            }, 2000);
        }

        // Add slide out animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideOut {
                0% { transform: translateX(0); opacity: 1; }
                100% { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Load cart items when the page loads
        window.onload = loadCartItems;
    </script>
</body>
</html>
